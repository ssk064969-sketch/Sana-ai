
name: Build Sana AI Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir work
          unzip -q "$ZIP" -d work
          DIR=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          test -f "$DIR/app/build.gradle.kts"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -eu

          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "BASE64 SECRET EMPTY"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "PASSWORD SECRET EMPTY"; exit 1; }
          test -n "$KEYSTORE_ALIAS" || { echo "ALIAS SECRET EMPTY"; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$DIR/app/sana-release.jks"

          test -s "$DIR/app/sana-release.jks"
          echo "BASE64 DECODE OK"

          if ! keytool -list -keystore "$DIR/app/sana-release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "KEYSTORE OR PASSWORD CHECK FAILED"
            exit 1
          fi

          echo "PASSWORD CHECK OK"

          if ! keytool -list -keystore "$DIR/app/sana-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null 2>&1; then
            echo "ALIAS CHECK FAILED"
            exit 1
          fi

          echo "ALIAS CHECK OK"

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          python3 - "$DIR/app/build.gradle.kts" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if 'create("release")' in s:
              raise SystemExit("Release signing already exists; refusing duplicate configuration")

          needle = '    kotlinOptions { jvmTarget = "17" }\n}'
          replacement = '''    signingConfigs {
              create("release") {
                  storeFile = file("sana-release.jks")
                  storePassword = System.getenv("KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("KEYSTORE_ALIAS")
                  keyPassword = System.getenv("KEYSTORE_PASSWORD")
              }
          }
          buildTypes {
              getByName("release") {
                  signingConfig = signingConfigs.getByName("release")
                  isMinifyEnabled = false
              }
          }
          kotlinOptions { jvmTarget = "17" }
          }'''

          if needle not in s:
              raise SystemExit("Expected Gradle configuration not found")

          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cd "$DIR"
          gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SanaAI-Release
          path: ${{ env.DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
